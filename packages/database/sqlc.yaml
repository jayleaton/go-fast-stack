version: "2"
sql:
  - engine: postgresql
    # Auth tables (owned by packages/auth) first, then app migrations.
    schema: [../auth/migrations, migrations]
    queries: queries
    gen:
      go:
        package: sqlc
        out: sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        omit_unused_structs: true # auth tables stay invisible unless a query uses them
        json_tags_case_style: camel
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamp
            go_type: time.Time
