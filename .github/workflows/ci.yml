# Single required check for branch protection and the merge queue: `ci-ok`.
# Other jobs may be skipped by path filters; ci-ok treats skipped as success.
# Draft PRs run no checks: mark ready for review to run CI. PRs check only the
# Go packages their changes can affect (scripts/affected.sh) and run mobile
# only when the app changed; pushes to main, merge_group and
# workflow_dispatch check everything. GitHub cannot filter
# drafts at the trigger, so a draft push still starts a run; its final job
# reports as "ci (draft, not run)", never as ci-ok, so it cannot stand in for
# the required check on that SHA.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:

# PR runs: draft and real runs use separate groups, so a skipped draft run
# (e.g. a push landing a second before "ready for review") never cancels the
# real run, and a newer push cancels the older real run; a cancelled run's
# ci-ok still runs and fails, so an old SHA never keeps a green required check.
# Everything else (pushes to main, merge queue, manual runs) gets a group of
# its own: a shared group made main pushes queue behind each other, and GitHub
# cancels a pending run when a newer one joins its group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-{1}-{2}', github.workflow, github.ref, github.event.pull_request.draft && 'draft' || 'run') || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

jobs:
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          run=false
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = false ]; then
            # The ready_for_review run may still be being created; give it time
            # so both runs don't do the full checks.
            sleep 15
            others=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" \
              | jq --arg wf "$WORKFLOW" --argjson id "$RUN_ID" '[.workflow_runs[] | select(.name == $wf and .id != $id)] | length')
            [ "$others" = 0 ] && run=true
          fi
          echo "PR #$PR ready-now run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # PRs and pushes to main run only the jobs whose paths changed; merge_group
  # and workflow_dispatch run everything.
  # Two parallel jobs (private-repo runners have 2 vCPUs; race-compiling is
  # CPU-bound). Each is billed rounded up to a whole minute, so lint shares
  # the db shard's runner: it runs while Postgres boots, which the DB tests
  # wait for anyway. "db" = lint + packages whose tests use Postgres;
  # "other" = the remaining packages.
  go:
    name: ${{ matrix.shard == 'db' && 'lint + test (db)' || 'test (other)' }}
    strategy:
      matrix:
        shard: [db, other]
    needs: draft
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    # Whether the mobile job runs (both legs compute the same value; matrix
    # outputs come from whichever leg finishes last).
    outputs:
      mobile: ${{ steps.mobile-pr.outputs.mobile || steps.mobile-push.outputs.mobile }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: mobile-pr
        with:
          filters: &mobile-filter |
            mobile:
              - 'apps/mobile-app/**'
              # The mobile route test reads the Go route table.
              - 'apps/web/internal/config/routes.go'
              - '.github/workflows/**'

      # Docs-only and mobile-only PRs stop here: no checkout, cache or
      # toolchain. PR events list changed files through the API.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!docs/**'
              - '!apps/mobile-app/**'
              - '!deploy/**' # its own module: the deploy job
              - '!*.md'
              - '!.gitignore'
              - '!.dockerignore'
      - name: Scope
        id: scope
        env:
          GO: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
        run: echo "go=$GO" >> "$GITHUB_OUTPUT"

      # db shard, any Go change: first thing, so it is up before tests run.
      # tmpfs and no fsync: test data is throwaway.
      - name: Start Postgres
        if: steps.scope.outputs.go == 'true' && matrix.shard == 'db'
        run: |
          nohup docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql postgres:18-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 \
            > "$RUNNER_TEMP/pg.log" 2>&1 &

      # Depth 2: a PR checkout is the merge commit, and HEAD^1 is the base.
      - uses: actions/checkout@v7
        if: steps.scope.outputs.go == 'true'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: mobile-push
        with:
          filters: *mobile-filter

      # Modules (and the go.mod toolchain) are keyed by go.sum; module zips and
      # dependencies' testdata are deleted before saving (builds read only the
      # extracted sources and .ziphash files). Build/lint caches are per shard,
      # keyed by commit and saved on every push to main, so PRs restore the
      # newest main state by prefix. Bump a prefix when what it caches changes.
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        id: mod-cache
        with:
          path: |
            ~/go/pkg/mod
          key: v7-gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: v7-gomod-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: v5-go${{ matrix.shard }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: v5-go${{ matrix.shard }}-${{ runner.os }}-

      # No setup-go: the runner's preinstalled go switches to the go.mod
      # version itself (GOTOOLCHAIN=auto); the toolchain lives in the module cache.
      - name: Go toolchain
        if: steps.scope.outputs.go == 'true'
        run: go version

      # PRs check only the packages their changes can affect, and only the
      # touched generators; shared inputs mean everything. See scripts/affected.sh.
      - name: Affected packages
        if: steps.scope.outputs.go == 'true'
        id: affected
        run: ./scripts/affected.sh HEAD^1
        env:
          AFFECTED_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}

      # ---- lint (db leg) ----
      - name: gofmt
        if: steps.scope.outputs.go == 'true' && matrix.shard == 'db'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo 'gofmt: run gofmt -w .'
            exit 1
          fi

      - uses: sqlc-dev/setup-sqlc@v5
        if: steps.affected.outputs.sqlc == 'true' && matrix.shard == 'db'
        with:
          sqlc-version: '1.31.1'

      - name: Generated code is up to date
        if: (steps.affected.outputs.sqlc == 'true' || steps.affected.outputs.templ == 'true' || steps.affected.outputs.generate != '') && matrix.shard == 'db'
        env:
          SQLC: ${{ steps.affected.outputs.sqlc }}
          TEMPL: ${{ steps.affected.outputs.templ }}
          GENERATE: ${{ steps.affected.outputs.generate }}
        run: |
          if [ "$SQLC" = true ]; then sqlc generate -f packages/database/sqlc.yaml; fi
          for p in $GENERATE; do go generate "$p"; done
          if [ "$TEMPL" = true ]; then
            for ui in packages/uikit apps/web/ui apps/admin/ui; do if [ -d "$ui" ]; then go tool templ generate -path "$ui"; fi; done
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --short; echo 'untracked generated files: run make generate and commit'; exit 1; }

      # Its own cache key only changes with go.sum or weekly; its directory
      # rides in the shard cache above instead.
      - uses: golangci/golangci-lint-action@v9
        if: steps.affected.outputs.packages != '' && matrix.shard == 'db'
        with:
          version: v2.15.0
          skip-cache: true
          args: ${{ steps.affected.outputs.dirs }}

      - name: Test boundaries
        if: steps.scope.outputs.go == 'true' && matrix.shard == 'db'
        run: ./scripts/check-test-boundaries.sh

      # The probes prove the lint and test rules still bite; their inputs
      # (scripts/, .golangci.yml) always force a full run.
      - name: Coverage floors name real packages
        if: steps.affected.outputs.full == 'true' && matrix.shard == 'db'
        run: ./scripts/check-coverage.sh --exist

      - name: Layering rules
        if: steps.affected.outputs.full == 'true' && matrix.shard == 'db'
        run: ./scripts/check-layering.sh
        env:
          GOLANGCI_LINT: golangci-lint

      - name: Test boundary probes
        if: steps.affected.outputs.full == 'true' && matrix.shard == 'other'
        run: ./scripts/check-test-probes.sh

      # ---- tests (both legs) ----
      - name: Shard
        if: steps.affected.outputs.packages != ''
        id: shard
        run: ./scripts/ci-shard.sh "${{ matrix.shard }}"
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}

      - name: Test
        if: steps.shard.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.shard.outputs.packages }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p .cache
          # With -coverprofile, go test also compiles packages without tests,
          # so there is no separate build step (lint type-checks everything too).
          # Test binaries wait for Postgres themselves (-exec wrapper), so
          # compiling them overlaps its boot. Checked inside the container over
          # TCP: docker's port proxy accepts host connections before Postgres
          # listens, and the image's first-boot init server answers on the unix
          # socket only.
          exec_flag=()
          if [ "$SHARD" = db ]; then
            cat > "$RUNNER_TEMP/wait-db" <<'SH'
          #!/usr/bin/env bash
          for _ in $(seq 1 480); do
            docker exec pg pg_isready -q -h 127.0.0.1 -U postgres 2>/dev/null && exec "$@"
            sleep 0.25
          done
          echo "postgres did not start:" >&2; cat "$RUNNER_TEMP/pg.log" >&2; docker logs pg >&2; exit 1
          SH
            chmod +x "$RUNNER_TEMP/wait-db"
            exec_flag=(-exec "$RUNNER_TEMP/wait-db")
          fi
          go test -race "${exec_flag[@]}" -coverprofile=.cache/coverage.out $PACKAGES # word splitting intended
          # Floors of this shard's packages; the shards together cover all.
          TESTED="$PACKAGES" ./scripts/check-coverage.sh .cache/coverage.out

      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: v5-go${{ matrix.shard }}-${{ runner.os }}-${{ github.sha }}

      # The db leg (lint) loads every package and its test imports, so it saves
      # the module cache. "!" exclusions in cache paths did not apply, so trim
      # explicitly: zips (~125 MB incl. the 71 MB toolchain zip) and dependency
      # testdata.
      - name: Trim module cache
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.mod-cache.outputs.cache-hit != 'true' && matrix.shard == 'db'
        run: |
          chmod -R u+w ~/go/pkg/mod
          find ~/go/pkg/mod/cache/download -name '*.zip' -delete
          find ~/go/pkg/mod -mindepth 2 -type d -name testdata -prune -exec rm -rf {} +
          du -sh ~/go/pkg/mod
      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.mod-cache.outputs.cache-hit != 'true' && matrix.shard == 'db'
        with:
          path: |
            ~/go/pkg/mod
          key: v7-gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

  # deploy/ is its own Go module (Railway IaC SDK + yaml), invisible to the
  # go job above. Runs only when it, the lint config or a workflow changes.
  deploy:
    needs: draft
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - '.golangci.yml'
              - '.github/workflows/**'
      - name: Scope
        id: scope
        env:
          RUN: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deploy == 'true' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
      - name: vet + test
        if: steps.scope.outputs.run == 'true'
        working-directory: deploy
        run: |
          go version
          go vet ./...
          (cd .railway && go vet railway.go)
          go test ./...
      - uses: golangci/golangci-lint-action@v9
        if: steps.scope.outputs.run == 'true'
        with:
          version: v2.15.0
          working-directory: deploy
          args: -c ../.golangci.yml ./...

  # Typecheck, lint, Expo SDK version check and unit tests. The contract test
  # (pnpm test:contract) needs Go + Docker and runs locally.
  mobile:
    needs: go
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.go.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v7

      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mobile-app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo lint
      - run: pnpm exec expo install --check
      - run: pnpm test

  # Skipped in runs that stay a draft (no billed minute). A skipped job shows
  # its raw name expression, never "ci-ok", so it cannot stand in for the
  # required check; when it runs, the name evaluates to "ci-ok".
  ci-ok:
    name: ${{ github.event.pull_request.draft && needs.draft.outputs.run != 'true' && 'ci (draft, not run)' || 'ci-ok' }}
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    needs: [draft, go, deploy, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo 'draft=${{ needs.draft.result }} go=${{ needs.go.result }} deploy=${{ needs.deploy.result }} mobile=${{ needs.mobile.result }}'
          exit 1
