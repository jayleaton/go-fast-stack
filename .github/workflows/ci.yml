# Pull requests only: every check runs in `make ci-local` on the agent's
# machine before merge (docs/CI.md, "Local verification"), and main (and dev)
# run no CI. This keeps the two small checks a ruleset can require: the
# secret scan, and the check that make ci-local's record holds for the head.
# A push to a deployed branch is gated separately (deploy-gate.yml).
#
# Runner: the CI_RUNNER repository variable, a JSON runs-on value such as
# '["self-hosted","linux"]'; GitHub-hosted ubuntu-latest without it.
name: CI

# Every job reads only, unless it asks for more itself.
permissions:
  contents: read

# A newer edit of a pull request cancels the run it supersedes.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    # Edits only: make ci-local posts local-ci, then fills the PR body, and
    # that edit starts the run that checks both. A push or a new PR starts
    # nothing, so until make ci-local runs on the head its required checks
    # wait as "Expected", never red; a job skipped by `if` would count as
    # passed, so the run itself must not start.
    types: [edited]

jobs:
  secrets:
    name: Secret scan
    # The pull request's changed files, docs included (docs/CI.md, "Secret
    # scan"). make ci-local runs it too; this one does not depend on the
    # agent's machine.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # The tool imports only the standard library: no module downloads.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: No secrets in the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: go run ./scripts/cilocal secret-scan --pr "$PR"

  local:
    name: Local verification
    # A pull request's checks ran in make ci-local on the agent's machine
    # (docs/CI.md, "Local verification"). This fails unless the local-ci
    # status on the head and the PR body's section attest that run.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/cilocal # and the root files (cone mode)
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: make ci-local passed on this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./scripts/cilocal check
