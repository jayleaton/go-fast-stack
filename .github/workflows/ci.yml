# Single required check for branch protection and the merge queue: `ci-ok`.
# Other jobs may be skipped by path filters; ci-ok treats skipped as success.
# Draft PRs run no checks: mark ready for review to run CI. PRs and pushes to
# main run only the jobs whose paths changed; merge_group and
# workflow_dispatch run everything. GitHub cannot filter
# drafts at the trigger, so a draft push still starts a run; its final job
# reports as "ci (draft, not run)", never as ci-ok, so it cannot stand in for
# the required check on that SHA.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:

# Draft and real runs use separate groups: a skipped draft run (e.g. a push
# landing a second before "ready for review") must never cancel the real run.
# Only PR runs cancel superseded ones; a cancelled run's ci-ok still runs and
# fails, so an old SHA never keeps a green required check. Pushes to main,
# merge queue and manual runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs started by a draft-PR event only. When a push and "ready for review"
  # land together, GitHub can attach the ready_for_review run to the previous
  # head, leaving this SHA with only the draft run. So: if the PR is ready by
  # now and no other CI run covers this SHA, this run does the real checks.
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          run=false
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = false ]; then
            # The ready_for_review run may still be being created; give it time
            # so both runs don't do the full checks.
            sleep 15
            others=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" \
              | jq --arg wf "$WORKFLOW" --argjson id "$RUN_ID" '[.workflow_runs[] | select(.name == $wf and .id != $id)] | length')
            [ "$others" = 0 ] && run=true
          fi
          echo "PR #$PR ready-now run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # PRs and pushes to main run only the jobs whose paths changed; merge_group
  # and workflow_dispatch run everything.
  changes:
    needs: draft
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || needs.draft.outputs.run == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      # PR events list changed files through the API; pushes diff with git.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '**/*.sql'
              - 'packages/database/sqlc.yaml'
              - '.golangci.yml'
              - 'Makefile'
              - 'apps/web/**'
              - 'apps/admin/**'
              - 'packages/**'
              - 'scripts/**'
              - 'Dockerfile'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile-app/**'
              # The mobile route test reads the Go route table.
              - 'apps/web/internal/config/routes.go'
              - '.github/workflows/**'

  # One job, not lint/test in parallel: a second runner's checkout + setup-go + cache restore (~20 s) outweighs warm lint time on a repo this size.
  go:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      # Not a service container: those start (pull + init) before the first
      # step. Started in the background here, Postgres boots while Go sets up.
      # tmpfs and no fsync: test data is throwaway.
      - name: Start Postgres
        run: |
          nohup docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql postgres:18-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 \
            > "$RUNNER_TEMP/pg.log" 2>&1 &

      # Depth 2: a PR checkout is the merge commit, and HEAD^1 is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # setup-go's cache only matched go.sum exactly, so any dependency change
      # started cold (3+ min). Restore by prefix instead: same go.sum first,
      # else the newest cache from main. Only pushes to main (and manual runs)
      # save, once per go.sum per day, so PRs never evict main's cache.
      # Bump the "go3" prefix when what is cached changes (e.g. the toolchain).
      - name: Go cache key
        id: go-cache
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: go-restore
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.go-cache.outputs.day }}
          restore-keys: |
            go3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go3-${{ runner.os }}-

      # No setup-go: extracting and copying Go into the tool cache took ~12 s.
      # The runner's preinstalled go switches to the go.mod version itself
      # (GOTOOLCHAIN=auto); the toolchain lives in the module cache restored above.
      - name: Go toolchain
        run: go version && go env GOROOT GOMODCACHE GOCACHE

      # PRs check only the packages their changes can affect (changed packages
      # plus everything importing them, tests included) and only the touched
      # generators; shared inputs (go.mod, tooling, workflows, lint config,
      # migrations) mean everything. Pushes to main, merge queue and manual
      # runs always check everything. See scripts/affected.sh.
      - name: Affected packages
        id: affected
        run: ./scripts/affected.sh HEAD^1
        env:
          AFFECTED_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo 'gofmt: run gofmt -w .'
            exit 1
          fi

      - uses: sqlc-dev/setup-sqlc@v5
        if: steps.affected.outputs.sqlc == 'true'
        with:
          sqlc-version: '1.31.1'

      - name: Generated code is up to date
        if: steps.affected.outputs.sqlc == 'true' || steps.affected.outputs.templ == 'true' || steps.affected.outputs.generate != ''
        env:
          SQLC: ${{ steps.affected.outputs.sqlc }}
          TEMPL: ${{ steps.affected.outputs.templ }}
          GENERATE: ${{ steps.affected.outputs.generate }}
        run: |
          if [ "$SQLC" = true ]; then sqlc generate -f packages/database/sqlc.yaml; fi
          for p in $GENERATE; do go generate "$p"; done
          if [ "$TEMPL" = true ]; then
            for ui in apps/web/ui apps/admin/ui; do if [ -d "$ui" ]; then go tool templ generate -path "$ui"; fi; done
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --short; echo 'untracked generated files: run make generate and commit'; exit 1; }

      - name: Build
        if: steps.affected.outputs.packages != ''
        run: go build $PACKAGES # word splitting intended
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}

      # Its own cache key only changes with go.sum or weekly, so an exact hit
      # kept a stale cache forever; its directory rides in the Go cache instead.
      - uses: golangci/golangci-lint-action@v9
        if: steps.affected.outputs.packages != ''
        with:
          version: v2.15.0
          skip-cache: true
          args: ${{ steps.affected.outputs.dirs }}

      - name: Test boundaries
        run: ./scripts/check-test-boundaries.sh

      # The probes prove the lint and test rules still bite; their inputs
      # (scripts/, .golangci.yml) always force a full run.
      - name: Layering rules
        if: steps.affected.outputs.full == 'true'
        run: ./scripts/check-layering.sh
        env:
          GOLANGCI_LINT: golangci-lint

      - name: Test boundary probes
        if: steps.affected.outputs.full == 'true'
        run: ./scripts/check-test-probes.sh

      # TCP, not the unix socket: the image's first-boot init server answers
      # on the socket only and is then restarted.
      - name: Wait for Postgres
        if: steps.affected.outputs.packages != ''
        run: |
          for _ in $(seq 1 120); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/pg.log"; docker logs pg; exit 1

      - name: Test
        if: steps.affected.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
          FULL: ${{ steps.affected.outputs.full }}
        run: |
          mkdir -p .cache
          go test -race -coverprofile=.cache/coverage.out $PACKAGES # word splitting intended
          if [ "$FULL" = true ]; then
            ./scripts/check-coverage.sh .cache/coverage.out
          else
            TESTED="$PACKAGES" ./scripts/check-coverage.sh .cache/coverage.out
          fi

      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.go-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ steps.go-cache.outputs.day }}

  # Typecheck, lint, Expo SDK version check and unit tests. The contract test
  # (pnpm test:contract) needs Go + Docker and runs locally.
  mobile:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v7

      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mobile-app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo lint
      - run: pnpm exec expo install --check
      - run: pnpm test

  # Always runs (a skipped job would show its raw name expression). In a run
  # that stayed a draft it reports as "ci (draft, not run)", not ci-ok.
  ci-ok:
    name: ${{ github.event.pull_request.draft && needs.draft.outputs.run != 'true' && 'ci (draft, not run)' || 'ci-ok' }}
    if: always()
    needs: [draft, changes, go, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo 'draft=${{ needs.draft.result }} changes=${{ needs.changes.result }} go=${{ needs.go.result }} mobile=${{ needs.mobile.result }}'
          exit 1
