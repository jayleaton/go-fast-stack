# Single required check for branch protection and the merge queue: `ci-ok`.
# Other jobs may be skipped by path filters; ci-ok treats skipped as success.
# Draft PRs run no checks: mark ready for review to run CI. PRs check only the
# Go packages their changes can affect (scripts/affected.sh) and run mobile
# only when the app changed; pushes to main, merge_group and
# workflow_dispatch check everything. GitHub cannot filter
# drafts at the trigger, so a draft push still starts a run; its final job
# reports as "ci (draft, not run)", never as ci-ok, so it cannot stand in for
# the required check on that SHA.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:

# PR runs: draft and real runs use separate groups, so a skipped draft run
# (e.g. a push landing a second before "ready for review") never cancels the
# real run, and a newer push cancels the older real run; a cancelled run's
# ci-ok still runs and fails, so an old SHA never keeps a green required check.
# Everything else (pushes to main, merge queue, manual runs) gets a group of
# its own: a shared group made main pushes queue behind each other, and GitHub
# cancels a pending run when a newer one joins its group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-{1}-{2}', github.workflow, github.ref, github.event.pull_request.draft && 'draft' || 'run') || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          run=false
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = false ]; then
            # The ready_for_review run may still be being created; give it time
            # so both runs don't do the full checks.
            sleep 15
            others=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" \
              | jq --arg wf "$WORKFLOW" --argjson id "$RUN_ID" '[.workflow_runs[] | select(.name == $wf and .id != $id)] | length')
            [ "$others" = 0 ] && run=true
          fi
          echo "PR #$PR ready-now run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # PRs and pushes to main run only the jobs whose paths changed; merge_group
  # and workflow_dispatch run everything.
  # Gates the mobile job only; the Go jobs decide for themselves (see "Scope").
  changes:
    needs: draft
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || needs.draft.outputs.run == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      # PR events list changed files through the API; pushes diff with git.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile-app/**'
              # The mobile route test reads the Go route table.
              - 'apps/web/internal/config/routes.go'
              - '.github/workflows/**'

  # lint and test run in parallel; each restores only the caches it uses.
  lint:
    needs: draft
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Depth 2: a PR checkout is the merge commit, and HEAD^1 is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Docs-only and mobile-only PRs stop here: no cache, no toolchain.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|apps/mobile-app/|[^/]*\.md$|\.gitignore$|\.dockerignore$|LICENSE)'; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "no Go-relevant changes"; echo go=false >> "$GITHUB_OUTPUT"
          fi

      # Modules (and the go.mod toolchain) are keyed by go.sum; module zips are
      # left out (builds read the extracted trees). Build/lint caches are keyed
      # by commit and saved on every push to main, so PRs restore the newest
      # main state by prefix. Bump the "v4" prefix when what is cached changes.
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        id: mod-cache
        with:
          path: |
            ~/go/pkg/mod
            !~/go/pkg/mod/cache/download/**/*.zip
          key: v4-gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: v4-gomod-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: v4-golint-${{ runner.os }}-${{ github.sha }}
          restore-keys: v4-golint-${{ runner.os }}-

      # No setup-go: the runner's preinstalled go switches to the go.mod
      # version itself (GOTOOLCHAIN=auto); the toolchain lives in the module cache.
      - name: Go toolchain
        if: steps.scope.outputs.go == 'true'
        run: go version

      # PRs check only the packages their changes can affect, and only the
      # touched generators; shared inputs mean everything. See scripts/affected.sh.
      - name: Affected packages
        if: steps.scope.outputs.go == 'true'
        id: affected
        run: ./scripts/affected.sh HEAD^1
        env:
          AFFECTED_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}

      - name: gofmt
        if: steps.scope.outputs.go == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo 'gofmt: run gofmt -w .'
            exit 1
          fi

      - uses: sqlc-dev/setup-sqlc@v5
        if: steps.affected.outputs.sqlc == 'true'
        with:
          sqlc-version: '1.31.1'

      - name: Generated code is up to date
        if: steps.affected.outputs.sqlc == 'true' || steps.affected.outputs.templ == 'true' || steps.affected.outputs.generate != ''
        env:
          SQLC: ${{ steps.affected.outputs.sqlc }}
          TEMPL: ${{ steps.affected.outputs.templ }}
          GENERATE: ${{ steps.affected.outputs.generate }}
        run: |
          if [ "$SQLC" = true ]; then sqlc generate -f packages/database/sqlc.yaml; fi
          for p in $GENERATE; do go generate "$p"; done
          if [ "$TEMPL" = true ]; then
            for ui in apps/web/ui apps/admin/ui; do if [ -d "$ui" ]; then go tool templ generate -path "$ui"; fi; done
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --short; echo 'untracked generated files: run make generate and commit'; exit 1; }

      # Its own cache key only changes with go.sum or weekly; its directory
      # rides in the lint cache above instead.
      - uses: golangci/golangci-lint-action@v9
        if: steps.affected.outputs.packages != ''
        with:
          version: v2.15.0
          skip-cache: true
          args: ${{ steps.affected.outputs.dirs }}

      - name: Test boundaries
        if: steps.scope.outputs.go == 'true'
        run: ./scripts/check-test-boundaries.sh

      # The probes prove the lint and test rules still bite; their inputs
      # (scripts/, .golangci.yml) always force a full run.
      - name: Layering rules
        if: steps.affected.outputs.full == 'true'
        run: ./scripts/check-layering.sh
        env:
          GOLANGCI_LINT: golangci-lint

      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: v4-golint-${{ runner.os }}-${{ github.sha }}

  test:
    needs: draft
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      # Depth 2: a PR checkout is the merge commit, and HEAD^1 is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Docs-only and mobile-only PRs stop here: no cache, no toolchain.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|apps/mobile-app/|[^/]*\.md$|\.gitignore$|\.dockerignore$|LICENSE)'; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "no Go-relevant changes"; echo go=false >> "$GITHUB_OUTPUT"
          fi

      # Modules (and the go.mod toolchain) are keyed by go.sum; module zips are
      # left out (builds read the extracted trees). Build/lint caches are keyed
      # by commit and saved on every push to main, so PRs restore the newest
      # main state by prefix. Bump the "v4" prefix when what is cached changes.
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        id: mod-cache
        with:
          path: |
            ~/go/pkg/mod
            !~/go/pkg/mod/cache/download/**/*.zip
          key: v4-gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: v4-gomod-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        if: steps.scope.outputs.go == 'true'
        with:
          path: |
            ~/.cache/go-build
          key: v4-gotest-${{ runner.os }}-${{ github.sha }}
          restore-keys: v4-gotest-${{ runner.os }}-

      # No setup-go: the runner's preinstalled go switches to the go.mod
      # version itself (GOTOOLCHAIN=auto); the toolchain lives in the module cache.
      - name: Go toolchain
        if: steps.scope.outputs.go == 'true'
        run: go version

      # PRs check only the packages their changes can affect, and only the
      # touched generators; shared inputs mean everything. See scripts/affected.sh.
      - name: Affected packages
        if: steps.scope.outputs.go == 'true'
        id: affected
        run: ./scripts/affected.sh HEAD^1
        env:
          AFFECTED_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}

      # Only when an affected package's tests use it; boots in the background
      # while the build runs. tmpfs and no fsync: test data is throwaway.
      - name: Start Postgres
        if: steps.affected.outputs.db == 'true'
        run: |
          nohup docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql postgres:18-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 \
            > "$RUNNER_TEMP/pg.log" 2>&1 &

      - name: Build
        if: steps.affected.outputs.packages != ''
        run: go build $PACKAGES # word splitting intended
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}

      - name: Test boundary probes
        if: steps.affected.outputs.full == 'true'
        run: ./scripts/check-test-probes.sh

      # TCP, not the unix socket: the image's first-boot init server answers
      # on the socket only and is then restarted.
      - name: Wait for Postgres
        if: steps.affected.outputs.db == 'true'
        run: |
          for _ in $(seq 1 120); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/pg.log"; docker logs pg; exit 1

      - name: Test
        if: steps.affected.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
          FULL: ${{ steps.affected.outputs.full }}
        run: |
          mkdir -p .cache
          go test -race -coverprofile=.cache/coverage.out $PACKAGES # word splitting intended
          if [ "$FULL" = true ]; then
            ./scripts/check-coverage.sh .cache/coverage.out
          else
            TESTED="$PACKAGES" ./scripts/check-coverage.sh .cache/coverage.out
          fi

      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          path: |
            ~/.cache/go-build
          key: v4-gotest-${{ runner.os }}-${{ github.sha }}
      - uses: actions/cache/save@v6
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.mod-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            !~/go/pkg/mod/cache/download/**/*.zip
          key: v4-gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

  # Typecheck, lint, Expo SDK version check and unit tests. The contract test
  # (pnpm test:contract) needs Go + Docker and runs locally.
  mobile:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v7

      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mobile-app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo lint
      - run: pnpm exec expo install --check
      - run: pnpm test

  # Always runs (a skipped job would show its raw name expression). In a run
  # that stayed a draft it reports as "ci (draft, not run)", not ci-ok.
  ci-ok:
    name: ${{ github.event.pull_request.draft && needs.draft.outputs.run != 'true' && 'ci (draft, not run)' || 'ci-ok' }}
    if: always()
    needs: [draft, changes, lint, test, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo 'draft=${{ needs.draft.result }} changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} mobile=${{ needs.mobile.result }}'
          exit 1
