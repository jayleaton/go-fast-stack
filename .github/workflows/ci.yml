# Single required check for branch protection and the merge queue: `ci-ok`.
# Other jobs may be skipped by path filters; ci-ok treats skipped as success.
# Draft PRs run no checks: mark ready for review to run CI (merge_group, push
# to main and workflow_dispatch always run everything). GitHub cannot filter
# drafts at the trigger, so a draft push still starts a run; its final job
# reports as "ci (draft, not run)", never as ci-ok, so it cannot stand in for
# the required check on that SHA.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:

# Draft and real runs use separate groups: a skipped draft run (e.g. a push
# landing a second before "ready for review") must never cancel the real run.
# Only PR runs cancel superseded ones; a cancelled run's ci-ok still runs and
# fails, so an old SHA never keeps a green required check. Pushes to main,
# merge queue and manual runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs started by a draft-PR event only. When a push and "ready for review"
  # land together, GitHub can attach the ready_for_review run to the previous
  # head, leaving this SHA with only the draft run. So: if the PR is ready by
  # now and no other CI run covers this SHA, this run does the real checks.
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          run=false
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = false ]; then
            # The ready_for_review run may still be being created; give it time
            # so both runs don't do the full checks.
            sleep 15
            others=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" \
              | jq --arg wf "$WORKFLOW" --argjson id "$RUN_ID" '[.workflow_runs[] | select(.name == $wf and .id != $id)] | length')
            [ "$others" = 0 ] && run=true
          fi
          echo "PR #$PR ready-now run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # PRs only: push to main and merge_group always run everything.
  changes:
    needs: draft
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (!github.event.pull_request.draft || needs.draft.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '**/*.sql'
              - 'packages/database/sqlc.yaml'
              - '.golangci.yml'
              - 'Makefile'
              - 'apps/web/**'
              - 'packages/**'
              - 'scripts/**'
              - 'Dockerfile'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile-app/**'

  # One job, not lint/test in parallel: a second runner's checkout + setup-go + cache restore (~20 s) outweighs warm lint time on a repo this size.
  go:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo 'gofmt: run gofmt -w .'
            exit 1
          fi

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'

      - name: Generated code is up to date
        run: |
          sqlc generate -f packages/database/sqlc.yaml
          go generate ./...
          if [ -d apps/web/ui ]; then go tool templ generate -path apps/web/ui; fi
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --short; echo 'untracked generated files: run make generate and commit'; exit 1; }

      - name: Build
        run: go build ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test boundaries
        run: ./scripts/check-test-boundaries.sh

      - name: Layering rules
        run: ./scripts/check-layering.sh
        env:
          GOLANGCI_LINT: golangci-lint

      - name: Test boundary probes
        run: ./scripts/check-test-probes.sh

      - name: Test
        run: |
          mkdir -p .cache
          go test -race -coverprofile=.cache/coverage.out ./...
          ./scripts/check-coverage.sh .cache/coverage.out
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  # Typecheck, lint, Expo SDK version check and unit tests. The contract test
  # (pnpm test:contract) needs Go + Docker and runs locally.
  mobile:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v7

      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mobile-app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo lint
      - run: pnpm exec expo install --check
      - run: pnpm test

  # Always runs (a skipped job would show its raw name expression). In a run
  # that stayed a draft it reports as "ci (draft, not run)", not ci-ok.
  ci-ok:
    name: ${{ github.event.pull_request.draft && needs.draft.outputs.run != 'true' && 'ci (draft, not run)' || 'ci-ok' }}
    if: always()
    needs: [draft, changes, go, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo 'draft=${{ needs.draft.result }} changes=${{ needs.changes.result }} go=${{ needs.go.result }} mobile=${{ needs.mobile.result }}'
          exit 1
