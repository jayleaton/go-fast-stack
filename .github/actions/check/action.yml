# The checks one CI job runs, shared by the single job (mode "all") and the
# two fan-out jobs ("db": lint + DB-backed tests, "other": the rest + mobile).
# Expects: checkout, module cache, Go toolchain and the affected outputs
# (scripts/affected.sh) to be done by the caller. The steps here only set up
# tools and caches; scripts/ci-check.sh runs the checks themselves as parallel
# tasks (lint, migration order, generated code, tests, deploy/, mobile), then
# the probes.
name: check
description: Lint, test and (optionally) mobile checks for the affected packages
inputs:
  mode: { description: "all | db | other", required: true }
  packages: { description: "affected import paths (or ./...)", required: true }
  dirs: { description: "affected package dirs for golangci-lint", required: true }
  full: { description: "full run (shared inputs changed)", required: true }
  sqlc: { description: "rerun sqlc", required: true }
  templ: { description: "rerun templ", required: true }
  generate: { description: "packages to go generate", required: true }
  mobile: { description: "run the mobile app checks", required: true }
  deploy: { description: "run the deploy/ module checks", required: true }
  save: { description: "save the build cache", required: true }
runs:
  using: composite
  steps:
    - name: Packages to test
      if: inputs.packages != ''
      id: shard
      shell: bash
      run: ./scripts/ci-shard.sh "${{ inputs.mode }}"
      env:
        PACKAGES: ${{ inputs.packages }}

    # Boots while caches restore and lint runs; only DB-backed test binaries
    # wait for it (see scripts/ci-check.sh). tmpfs and no fsync: test data is
    # throwaway. The fan-out "db" job starts it itself, first thing (ci.yml).
    - name: Start Postgres
      if: steps.shard.outputs.db == 'true' && inputs.mode != 'db'
      shell: bash
      run: |
        nohup docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
          --tmpfs /var/lib/postgresql postgres:18-alpine \
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 \
          > "$RUNNER_TEMP/pg.log" 2>&1 &

    # Build + lint cache, keyed by commit: saved by the single CI job on pushes
    # to dev or main and restored by prefix everywhere else (incl. opt-in fan-out).
    - uses: actions/cache/restore@v6
      if: inputs.packages != '' || inputs.deploy == 'true'
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: v7-go-${{ runner.os }}-${{ github.sha }}
        restore-keys: v7-go-${{ runner.os }}-

    - uses: sqlc-dev/setup-sqlc@v5
      if: inputs.mode != 'other' && inputs.sqlc == 'true'
      with:
        sqlc-version: '1.31.1'

    # Only the binary: ci-check.sh runs it (root module and deploy/ at once).
    # Its own cache rides in the build cache above.
    - uses: golangci/golangci-lint-action@v9
      if: (inputs.mode != 'other' && inputs.packages != '') || inputs.deploy == 'true'
      with:
        version: v2.15.0
        install-only: true

    # ---- mobile app: Node from the runner's tool cache, pnpm via corepack
    # (the packageManager pin), node_modules cached by lockfile ----
    # (The contract test, pnpm test:contract, needs Go + Docker and runs locally.)
    - uses: actions/setup-node@v7
      if: inputs.mobile == 'true'
      with:
        node-version: 22
    - name: pnpm
      if: inputs.mobile == 'true'
      shell: bash
      run: corepack enable
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    - uses: actions/cache/restore@v6
      if: inputs.mobile == 'true'
      id: node-modules
      with:
        path: apps/mobile-app/node_modules
        key: v1-mobile-nm-${{ runner.os }}-node22-${{ hashFiles('apps/mobile-app/pnpm-lock.yaml') }}

    - name: Checks
      shell: bash
      run: ./scripts/ci-check.sh
      env:
        MODE: ${{ inputs.mode }}
        DIRS: ${{ inputs.packages != '' && inputs.dirs || '' }}
        TESTS: ${{ steps.shard.outputs.packages }}
        DB: ${{ steps.shard.outputs.db }}
        FULL: ${{ inputs.full }}
        SQLC: ${{ inputs.sqlc }}
        TEMPL: ${{ inputs.templ }}
        GENERATE: ${{ inputs.generate }}
        MOBILE: ${{ inputs.mobile }}
        DEPLOY: ${{ inputs.deploy }}
        EVENT: ${{ github.event_name }}
        TARGET: ${{ github.base_ref || github.ref_name }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    - uses: actions/cache/save@v6
      if: inputs.save == 'true' && inputs.packages != '' && inputs.mode == 'all'
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: v7-go-${{ runner.os }}-${{ github.sha }}
    # Any branch saves a missing node_modules: there is one per lockfile.
    - uses: actions/cache/save@v6
      if: inputs.mobile == 'true' && steps.node-modules.outputs.cache-hit != 'true'
      with:
        path: apps/mobile-app/node_modules
        key: v1-mobile-nm-${{ runner.os }}-node22-${{ hashFiles('apps/mobile-app/pnpm-lock.yaml') }}
