# The checks one CI job runs, shared by the single job (mode "all") and the
# two fan-out jobs ("db": lint + DB-backed tests, "other": the rest + mobile).
# Expects: checkout, module cache, Go toolchain and the affected outputs
# (scripts/affected.sh) to be done by the caller.
name: check
description: Lint, test and (optionally) mobile checks for the affected packages
inputs:
  mode: { description: "all | db | other", required: true }
  packages: { description: "affected import paths (or ./...)", required: true }
  dirs: { description: "affected package dirs for golangci-lint", required: true }
  full: { description: "full run (shared inputs changed)", required: true }
  sqlc: { description: "rerun sqlc", required: true }
  templ: { description: "rerun templ", required: true }
  generate: { description: "packages to go generate", required: true }
  mobile: { description: "run the mobile app checks", required: true }
  save: { description: "save the build cache", required: true }
runs:
  using: composite
  steps:
    - name: Packages to test
      if: inputs.packages != ''
      id: shard
      shell: bash
      run: ./scripts/ci-shard.sh "${{ inputs.mode }}"
      env:
        PACKAGES: ${{ inputs.packages }}

    # Boots while caches restore and lint runs; only DB-backed test binaries
    # wait for it (see Test). tmpfs and no fsync: test data is throwaway. The
    # fan-out "db" job starts it itself, first thing (see ci.yml).
    - name: Start Postgres
      if: steps.shard.outputs.db == 'true' && inputs.mode != 'db'
      shell: bash
      run: |
        nohup docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
          --tmpfs /var/lib/postgresql postgres:18-alpine \
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 \
          > "$RUNNER_TEMP/pg.log" 2>&1 &

    # Build + lint caches per mode, keyed by commit, saved on pushes to main
    # and restored by prefix in PRs.
    - uses: actions/cache/restore@v6
      if: inputs.packages != ''
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: v6-go${{ inputs.mode }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: v6-go${{ inputs.mode }}-${{ runner.os }}-

    # ---- lint ("all" and "db") ----
    - name: gofmt
      if: inputs.mode != 'other' && inputs.packages != ''
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "$unformatted"; echo 'gofmt: run gofmt -w .'; exit 1
        fi

    - uses: sqlc-dev/setup-sqlc@v5
      if: inputs.mode != 'other' && inputs.sqlc == 'true'
      with:
        sqlc-version: '1.31.1'

    - name: Generated code is up to date
      if: inputs.mode != 'other' && (inputs.sqlc == 'true' || inputs.templ == 'true' || inputs.generate != '')
      shell: bash
      env:
        SQLC: ${{ inputs.sqlc }}
        TEMPL: ${{ inputs.templ }}
        GENERATE: ${{ inputs.generate }}
      run: |
        if [ "$SQLC" = true ]; then sqlc generate -f packages/database/sqlc.yaml; fi
        for p in $GENERATE; do go generate "$p"; done
        if [ "$TEMPL" = true ]; then
          for ui in apps/web/ui apps/admin/ui; do if [ -d "$ui" ]; then go tool templ generate -path "$ui"; fi; done
        fi
        git diff --exit-code
        test -z "$(git status --porcelain)" || { git status --short; echo 'untracked generated files: run make generate and commit'; exit 1; }

    # Its own cache rides in the build cache above.
    - uses: golangci/golangci-lint-action@v9
      if: inputs.mode != 'other' && inputs.packages != ''
      with:
        version: v2.15.0
        skip-cache: true
        args: ${{ inputs.dirs }}

    - name: Test boundaries
      if: inputs.mode != 'other' && inputs.packages != ''
      shell: bash
      run: ./scripts/check-test-boundaries.sh

    # The probes prove the lint and test rules still bite; their inputs
    # (scripts/, .golangci.yml) always force a full run.
    - name: Coverage floors name real packages
      if: inputs.mode != 'other' && inputs.full == 'true'
      shell: bash
      run: ./scripts/check-coverage.sh --exist
    - name: Layering rules
      if: inputs.mode != 'other' && inputs.full == 'true'
      shell: bash
      run: ./scripts/check-layering.sh
      env:
        GOLANGCI_LINT: golangci-lint
    - name: Test boundary probes
      if: inputs.mode != 'db' && inputs.full == 'true'
      shell: bash
      run: ./scripts/check-test-probes.sh

    # ---- tests ----
    # With -coverprofile go test also compiles packages without tests (lint
    # type-checks everything too), so there is no build step. DB-backed test
    # binaries wait for Postgres through an -exec wrapper, so compiling
    # overlaps its boot. Readiness is checked inside the container over TCP:
    # docker's port proxy accepts connections before Postgres listens, and the
    # image's first-boot init server answers on the unix socket only.
    - name: Test
      if: steps.shard.outputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ steps.shard.outputs.packages }}
        DB: ${{ steps.shard.outputs.db }}
      run: |
        mkdir -p .cache
        exec_flag=()
        if [ "$DB" = true ]; then
          cat > "$RUNNER_TEMP/wait-db" <<'SH'
        #!/usr/bin/env bash
        if grep -lqE 'dbtest|TEST_DATABASE_URL' ./*_test.go 2>/dev/null; then
          # 2x the measured Postgres boot (12-22 s): never waits longer than 45 s.
          for _ in $(seq 1 180); do
            docker exec pg pg_isready -q -h 127.0.0.1 -U postgres 2>/dev/null && exec "$@"
            sleep 0.25
          done
          echo "postgres did not start:" >&2; cat "$RUNNER_TEMP/pg.log" >&2; docker logs pg >&2; exit 1
        fi
        exec "$@"
        SH
          chmod +x "$RUNNER_TEMP/wait-db"
          exec_flag=(-exec "$RUNNER_TEMP/wait-db")
        fi
        go test -race "${exec_flag[@]}" -coverprofile=.cache/coverage.out $PACKAGES # word splitting intended
        TESTED="$PACKAGES" ./scripts/check-coverage.sh .cache/coverage.out

    - uses: actions/cache/save@v6
      if: inputs.save == 'true' && inputs.packages != ''
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: v6-go${{ inputs.mode }}-${{ runner.os }}-${{ github.sha }}

    # ---- mobile app: typecheck, lint, Expo SDK check, unit tests ----
    # (The contract test, pnpm test:contract, needs Go + Docker and runs locally.)
    - uses: pnpm/action-setup@v6
      if: inputs.mobile == 'true'
      with:
        package_json_file: apps/mobile-app/package.json
    - uses: actions/setup-node@v7
      if: inputs.mobile == 'true'
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/mobile-app/pnpm-lock.yaml
    - name: Mobile app checks
      if: inputs.mobile == 'true'
      shell: bash
      working-directory: apps/mobile-app
      run: |
        pnpm install --frozen-lockfile
        pnpm exec tsc --noEmit
        pnpm exec expo lint
        pnpm exec expo install --check
        pnpm test
