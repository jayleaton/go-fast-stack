# The one file that decides your Railway project. Edit it, then:
#   make railway-plan    # what would change (read-only)
#   make railway-apply   # create or update the project to match
# Re-running converges; changing a value here updates every environment.
# Removing things (admin: false after true, an environment) never deletes
# anything unless you pass CONFIRM_DESTRUCTIVE=1. See docs/deploy.md.
version: 1

# Railway project name: created on the first apply if it does not exist,
# otherwise reused (matched by exact name in the workspace). auto: the
# GitHub repo name (or this directory's name).
project: auto
# Railway workspace name or id. Empty: your only workspace (required when you
# belong to more than one).
workspace: ""

# GitHub repo and branch Railway builds on push. auto: this checkout's
# origin remote. Until the Railway GitHub app can read the repo, setup
# deploys your checkout by upload instead and prints the install link; the
# next make railway-apply after installing switches to deploy-on-push.
# "" never connects GitHub: deploy with make railway-up.
repo: auto
branch: main
# Optional per-environment branch, e.g. production deploys a release branch.
# branches:
#   production: release

# The admin dashboard (apps/admin) as its own service with its own small
# Postgres. Adds two services per environment.
admin: false

# production | staging,production | staging,qa,production
# Production-only is the cheapest start; teams usually want staging,production.
environments: production

# Railway PR environments: a temporary copy of staging per pull request
# (needs staging in environments; a preview never copies production). Off by
# default: each preview runs its own web + Postgres while the PR is open.
previews: false

# Railway region for every service and database. Empty: Railway's default.
# List: railway api 'query { regions { name location } }'
region: ""

# Where live secrets (RESEND_API_KEY, ...) come from: doppler polls a
# Doppler config per service and environment, so they rotate without a
# redeploy; env reads Railway variables at boot. With doppler, setup moves
# the secrets into Doppler when the Doppler CLI is logged in (doppler login;
# or later: make doppler-setup); until then services run on env.
secrets:
  provider: doppler
  # Doppler project (created if missing; auto: the Railway project's name).
  # Environments map
  # production->prd, staging->stg, qa->qa, local->dev; admin reads a branch
  # config (prd_admin, ...) the web token cannot read.
  project: go-fast-stack

email:
  from: noreply@example.com

# admin_bootstrap_email: you@example.com   # first admin, seeded by `admin migrate`

# Nightly database backups (docs/backups.md): a small cron
# service, backup, dumps the app database (pg_dump, compressed), encrypts it
# with BACKUP_ENCRYPTION_KEY (generated; keep a copy outside Railway) and
# stores it in a Railway storage bucket, then prunes. Restore: make
# railway-restore. Costs cents a month at template sizes.
backups:
  enabled: true
  schedule: "0 3 * * *"   # cron, UTC
  keep_daily: 7           # the newest backup of each of the last 7 days
  keep_weekly: 4          # and of each of the last 4 weeks
  admin: true             # also admin-postgres, when admin: true
  region: ""              # bucket region: sjc, iad, ams, sin ("": nearest region:, else sjc)
  # railway: a Railway storage bucket (no other account). external: your own
  # S3-compatible bucket off Railway (Cloudflare R2, Backblaze B2, AWS S3);
  # set backup/BACKUP_S3_* yourself (docs/backups.md).
  storage: railway

# Per-service caps (per replica). Railway bills actual usage, so caps only
# bound a runaway process; a Go service idles at a few tens of MB.
resources:
  web:   { cpu: 1, memory_mb: 512, replicas: 1 }
  admin: { cpu: 0.5, memory_mb: 256, replicas: 1 }

# Extra variables IaC leaves alone (set them in the dashboard or with
# `railway variable set`): NAME, a glob like STRIPE_*, or service/NAME.
unmanaged_variables: []
